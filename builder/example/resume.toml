# ------------------------------------------------------------------ projects: bullet bank
[projects.kv]
name = "tinykv"
desc = "Raft-Replicated Key-Value Store"
tags = "Go · Raft Consensus"
url = "https://github.com/example/tinykv"
live = "https://example.com/tinykv/"         # optional: demo or project page, shown as "Live"
dates = "Oct 2026"
[projects.kv.bullets]
core = "Built a Raft key-value store in Go (stdlib only): leader election, log replication, and a <b>CRC-checked write-ahead log</b> with fsync and group commit."
chaos = "Lost <b>0 of 10,000 acknowledged writes</b> across <b>50 SIGKILL faults</b> in a chaos harness that reads every acked key back through the log."
perf = "Scaled a 3-node cluster from <b>80 to 2,400 writes/s</b> (1 to 64 clients) via group commit; measured <b>250 ms median</b> leader failover."

[projects.gateway]
name = "throttle"
desc = "Rate-Limiting API Gateway"
tags = "Go · Redis · Rate Limiting"
url = "https://github.com/example/throttle"
[projects.gateway.bullets]
algo = "Implemented <b>4 rate-limiting algorithms</b> (token bucket, fixed window, sliding log, sliding counter) behind one interface with in-memory and Redis backends."
redis = "Used <b>atomic Redis Lua scripts</b> so 3 gateway instances enforced a shared 1,000 req/s limit exactly under load."

[projects.shop]
name = "Shopline"
desc = "E-Commerce Backend"
tags = "Java · Spring Boot · AWS"
url = "https://github.com/example/shopline"
[projects.shop.bullets]
api = "Designed <b>25 REST endpoints</b> and a normalized PostgreSQL schema for carts, orders and inventory with optimistic locking."
test = "Reached <b>90% line coverage</b> with JUnit and Testcontainers; CI on GitHub Actions blocks merges on failing tests."
aws = "Deployed with Docker on <b>AWS ECS Fargate</b> behind an ALB with RDS PostgreSQL, defined as code in Terraform."

[projects.rag]
name = "DocQA"
desc = "Q&amp;A over Support Tickets"
tags = "Python · RAG · Retrieval Evaluation"
url = "https://github.com/example/docqa"
[projects.rag.bullets]
eval = "Benchmarked <b>12 retrieval configurations</b> on a 60-query test set, raising <b>Recall@5 from 65% to 95%</b> with hybrid BM25 + vector search."
lat = "Cut p50 answer latency from <b>9.0s to 3.5s</b> by caching embeddings and removing a redundant retrieval call."

