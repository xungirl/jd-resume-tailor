# ------------------------------------------------------------------ variants: one per JD family
[variants.backend]            # general backend SWE
skills = ["lang_java", "backend", "dist", "cloud", "test"]
projects = [
  { key = "shop", bullets = ["api", "test", "aws"] },
  { key = "kv", bullets = ["core", "chaos"] },
  { key = "gateway", bullets = ["algo", "redis"] },
]

[variants.infra]              # storage / distributed systems / infra, Go shops
availability = true           # JD asked for start/end dates
tags = { kv = "Go · Raft · Distributed Storage" }   # re-picked for this JD family
skills = ["lang_go", "dist", "cloud", "test", "backend"]
projects = [
  { key = "kv", bullets = ["core", "chaos", "perf"] },
  { key = "gateway", bullets = ["algo", "redis"] },
  { key = "shop", bullets = ["aws"] },
]

[variants.ai]                 # AI / LLM application engineering
skills = ["ai", "lang_java", "backend", "cloud"]
projects = [
  { key = "rag", bullets = ["eval", "lat"] },
  { key = "shop", bullets = ["api", "aws"] },
  { key = "kv", bullets = ["core", "chaos"] },
]
