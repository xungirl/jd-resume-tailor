# Example bullet bank for a FICTIONAL candidate. Replace everything with your own facts.
#
# Rules this file is built around:
#   * every bullet is something you can defend in an interview, with a number you measured
#   * bullets have short keys so a variant can pick them: projects = [{key="kv", bullets=["core","chaos"]}]
#   * write MORE bullets than fit on a page; variants choose, the bank never lies
#   * optional `tags` after a project title: 2-3 core words (main language + the capability), e.g. "Go · Raft Consensus";
#     a variant can re-pick them for one JD with  tags = { kv = "Go · Distributed Storage" }

