<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume</title>
<style>
  @page { size: letter; margin: 0.5in 0.55in; }
  :root { color-scheme: light; }
  html, body { margin: 0; background: #e9eaf0; }
  body { font: 10.5pt/1.32 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #111; }
  .bar { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px;
    background: #fff; border-bottom: 1px solid #ddd; font: 13px -apple-system, system-ui, sans-serif; }
  .bar button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #4c6ef5, #845ef7); font-weight: 600; }
  .bar span { color: #5d6275; }
  .sheet { width: 8.5in; min-height: 11in; margin: 16px auto; padding: 0.5in 0.55in; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.12); box-sizing: border-box; }
  h1 { font-size: 18pt; margin: 0 0 2pt; text-align: center; letter-spacing: .3pt; }
  h1 + p { text-align: center; margin: 0 0 6pt; font-size: 9.5pt; }
  h2 { font-size: 10.5pt; text-transform: uppercase; letter-spacing: .8pt; margin: 9pt 0 3pt; padding-bottom: 1.5pt; border-bottom: 0.8pt solid #222; }
  h3 { font-size: 10.5pt; margin: 5pt 0 1pt; }
  p { margin: 0 0 2pt; }
  ul { margin: 0 0 3pt; padding-left: 14pt; }
  li { margin: 0 0 1pt; }
  a { color: inherit; text-decoration: none; }
  code { font: inherit; }
  @media print {
    html, body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="bar"><button id="print">Save as PDF</button><span>In the print dialog, choose "Save as PDF". If it runs past one page, trim a bullet in the text and try again.</span></div>
<div class="sheet" id="doc"></div>
<script type="module" src="print.js"></script>
</body>
</html>
